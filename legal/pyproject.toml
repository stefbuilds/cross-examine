[project]
name = "cross-examine-legal"
version = "0.1.0"
description = "Cross-Examine legal domain: versioned sources, fixed mechanical predicates and evidence receipts"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"  # see the repository-root LICENSE
dependencies = [
    "pypdf==6.1.1",
]

[project.scripts]
cross-examine-legal = "cross_examine_legal.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cross_examine_legal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
